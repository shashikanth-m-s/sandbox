trigger: none

jobs:
- job: GCP_Deploy
  displayName: 'Deploy Resources to Google Cloud'
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  # Download the secret JSON key securely to the agent
  - task: DownloadSecureFile@1
    name: gcpKeyFile
    displayName: 'Download GCP Service Account Key'
    inputs:
      secureFile: 'gcp-key.json'

  - bash: |
      terraform init
    displayName: 'Terraform Init'
    workingDirectory: '$(Build.SourcesDirectory)/gcp'
    env:
      GOOGLE_APPLICATION_CREDENTIALS: $(gcpKeyFile.secureFilePath)

  - bash: |
      terraform plan -out=tfplan -input=false
    displayName: 'Terraform Plan'
    workingDirectory: '$(Build.SourcesDirectory)/gcp'
    env:
      GOOGLE_APPLICATION_CREDENTIALS: $(gcpKeyFile.secureFilePath)

  - bash: |
      terraform apply -input=false tfplan
    displayName: 'Terraform Apply'
    workingDirectory: '$(Build.SourcesDirectory)/gcp'
    env:
      GOOGLE_APPLICATION_CREDENTIALS: $(gcpKeyFile.secureFilePath)