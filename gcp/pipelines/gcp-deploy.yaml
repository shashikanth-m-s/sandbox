trigger: none

variables:
  - group: gcp-credentials # Links the variable group created in Step 1

jobs:
- job: GCP_Deploy
  displayName: 'Deploy Resources to Google Cloud'
  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  # Authenticate GCP by creating the credentials file and setting the environment variable
  - bash: |
      set -e
      echo "$GCP_KEY" > $(Agent.TempDirectory)/gcp-key.json
      echo "##vso[task.setvariable variable=GOOGLE_APPLICATION_CREDENTIALS]$(Agent.TempDirectory)/gcp-key.json"
    displayName: 'Configure GCP Credentials'
    env:
      GCP_KEY: $(GCP_CREDENTIALS_JSON)

  - bash: |
      terraform init
    displayName: 'Terraform Init'
    workingDirectory: '$(Build.SourcesDirectory)/infra/gcp'

  - bash: |
      terraform plan -out=tfplan -input=false
    displayName: 'Terraform Plan'
    workingDirectory: '$(Build.SourcesDirectory)/infra/gcp'

  - bash: |
      terraform apply -input=false tfplan
    displayName: 'Terraform Apply'
    workingDirectory: '$(Build.SourcesDirectory)/infra/gcp'

  # Cleanup credentials after pipeline finishes
  - bash: |
      rm -f $(Agent.TempDirectory)/gcp-key.json
    displayName: 'Cleanup Credentials'
    condition: always()