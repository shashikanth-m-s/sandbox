parameters:
  - name: terraformTarget
    displayName: 'Terraform Target Selection'
    type: string
    default: 'dns_and_public_ip'
    values:
      - 'dns_and_public_ip'
      - 'module.dns_records'
      - 'module.public_dns'
      - 'all'

trigger: none
#   branches:
#     include:
#       - main

variables:
  azureServiceConnection: 'sandboxSC'
  resourceGroupName: '1-eb44138c-playground-sandbox'
  azureServiceConnectionProd: 'sandboxfree'
  resourceGroupNameProd: 'rg-kannadi-prod'

stages:

# ============================================================
# DEV
# ============================================================

- stage: Dev
  displayName: 'Terraform Deploy - Dev'

  jobs:
  - deployment: Terraform_Dev
    displayName: 'Terraform Dev'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'sandbox'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init - Dev'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(resourceGroupName)'
              backendAzureRmStorageAccountName: 'stsandboxdev001'
              backendAzureRmContainerName: 'devcontainer'
              backendAzureRmKey: 'dev.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              ${{ if eq(parameters.terraformTarget, 'all') }}:
                commandOptions: '-var-file="environments/dev.tfvars" -out=tfplan -input=false'
              ${{ elseif eq(parameters.terraformTarget, 'dns_and_public_ip') }}:
                # Targets both Public IP inside the network module and DNS records
                commandOptions: '-var-file="environments/dev.tfvars" -target=module.network.azurerm_public_ip.this -target=module.dns_records -out=tfplan -input=false'
              ${{ else }}:
                commandOptions: '-var-file="environments/dev.tfvars" -target=${{ parameters.terraformTarget }} -out=tfplan -input=false'

          - task: CopyFiles@2
            displayName: 'Package Terraform Dev'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/infra/terraform'
              Contents: |
                **/*.tf
                environments/**/*.tfvars
                .terraform.lock.hcl
                tfplan
              TargetFolder: '$(Build.ArtifactStagingDirectory)/terraform-dev'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Dev Package'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/terraform-dev'
              artifact: 'terraform-dev'
              publishLocation: 'pipeline'

          # - task: TerraformTaskV4@4
          #   displayName: 'Terraform Plan'
          #   inputs:
          #     provider: 'azurerm'
          #     command: 'plan'
          #     workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
          #     environmentServiceNameAzureRM: '$(azureServiceConnection)'
          #     commandOptions: '-out=tfplan -input=false'
          # - task: TerraformTaskV4@4
          #   displayName: 'Terraform Apply - Dev'
          #   inputs:
          #     provider: 'azurerm'
          #     command: 'apply'
          #     workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
          #     environmentServiceNameAzureRM: '$(azureServiceConnection)'
          #     commandOptions: '-var-file=dev.tfvars -auto-approve -input=false'


# ============================================================
# PROD
# ============================================================

- stage: Prod
  displayName: 'Terraform Deploy - Prod'

  # dependsOn: Dev
  # condition: succeeded()

  jobs:
  - deployment: Terraform_Prod
    displayName: 'Terraform Prod'
    pool:
      vmImage: 'ubuntu-latest'
    # Targets your Azure DevOps environment where approvals are configured
    environment: 'kannadi'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init - Prod'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
              backendServiceArm: '$(azureServiceConnectionProd)'
              backendAzureRmResourceGroupName: '$(resourceGroupNameProd)'
              backendAzureRmStorageAccountName: 'strgkannadiprod001'
              backendAzureRmContainerName: 'prodcontainer'
              backendAzureRmKey: 'prod.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
              environmentServiceNameAzureRM: '$(azureServiceConnectionProd)'
              ${{ if eq(parameters.terraformTarget, 'all') }}:
                commandOptions: '-var-file="environments/prod.tfvars" -out=tfplan -input=false'
              ${{ elseif eq(parameters.terraformTarget, 'dns_and_public_ip') }}:
                # Targets both Public IP inside the network module and DNS records
                commandOptions: '-var-file="environments/prod.tfvars" -target=module.network.azurerm_public_ip.this -target=module.dns_records -out=tfplan -input=false'
              ${{ else }}:
                commandOptions: '-var-file="environments/prod.tfvars" -target=${{ parameters.terraformTarget }} -out=tfplan -input=false'

          - task: CopyFiles@2
            displayName: 'Package Terraform Prod'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/infra/terraform'
              Contents: |
                **/*.tf
                environments/**/*.tfvars
                .terraform.lock.hcl
                tfplan
              TargetFolder: '$(Build.ArtifactStagingDirectory)/terraform-prod'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Prod Package'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/terraform-prod'
              artifact: 'terraform-prod'
              publishLocation: 'pipeline'

