trigger: none
#   branches:
#     include:
#       - main

variables:
  azureServiceConnection: 'sandboxSC'
  resourceGroupName: '1-7f23ad35-playground-sandbox'

stages:

# ============================================================
# DEV
# ============================================================

- stage: Dev
  displayName: 'Terraform Deploy - Dev'

  jobs:
  - job: Terraform_Dev
    displayName: 'Terraform Dev'

    pool:
      vmImage: 'windows-latest'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init - Dev'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '1-7f23ad35-playground-sandbox'
        backendAzureRmStorageAccountName: 'stsandboxdev001'
        backendAzureRmContainerName: 'devcontainer'
        backendAzureRmKey: 'dev.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-var-file=environments/dev.tfvars -out=tfplan -input=false'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/infra/terraform/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'
    # - task: TerraformTaskV4@4
    #   displayName: 'Terraform Apply - Dev'
    #   inputs:
    #     provider: 'azurerm'
    #     command: 'apply'
    #     workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
    #     environmentServiceNameAzureRM: '$(azureServiceConnection)'
    #     commandOptions: '-var-file=dev.tfvars -auto-approve -input=false'


# ============================================================
# PROD
# ============================================================

- stage: Prod
  displayName: 'Terraform Deploy - Prod'

  dependsOn: Dev
  condition: succeeded()

  jobs:
  - job: Terraform_Prod

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Init - Prod'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: '1-02984b8e-playground-sandbox'
        backendAzureRmStorageAccountName: 'stsandboxprod001'
        backendAzureRmContainerName: 'prodcontainer'
        backendAzureRmKey: 'prod.tfstate'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'

    - task: TerraformTaskV4@4
      displayName: 'Terraform Plan - Prod'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(Build.SourcesDirectory)/infra/terraform'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'
        commandOptions: '-var-file=environments/prod.tfvars -out=tfplan -input=false'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.SourcesDirectory)/infra/terraform/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

