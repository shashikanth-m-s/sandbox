trigger: none
  # branches:
  #   include:
  #     - main

variables:
  azureServiceConnection: 'sandboxSC'
  resourceGroupName: '1-eb44138c-playground-sandbox'
  azureServiceConnectionProd: 'sandboxfree'
  resourceGroupNameProd: 'sms-rg-core-pd'

stages:

# ============================================================
# DEV
# ============================================================
- stage: Dev
  displayName: 'Deploy to Dev'

  jobs:
  - job: Deploy_Dev
    displayName: 'Deploy Bicep - Dev'

    pool:
      vmImage: 'windows-latest'

    steps:
    - checkout: self

    - task: AzurePowerShell@5
      displayName: 'Deploy Bicep'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        ScriptType: 'InlineScript'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
        Inline: |
          Write-Host "Deploying Bicep to Dev..."

          New-AzResourceGroupDeployment `
            -ResourceGroupName "$(resourceGroupName)" `
            -TemplateFile "$(Build.SourcesDirectory)/infra/bicep/main.bicep" `
            -TemplateParameterFile "$(Build.SourcesDirectory)/infra/bicep/parameters/dev.json" `
            -Verbose


# ============================================================
# PROD
# ============================================================
- stage: Prod
  displayName: 'Deploy to Prod'

  # dependsOn: Dev
  # condition: succeeded()

  jobs:
  - job: Deploy_Prod
    displayName: 'Deploy Bicep - Prod'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: AzurePowerShell@5
      displayName: 'Deploy Bicep'
      inputs:
        azureSubscription: '$(azureServiceConnectionProd)'
        ScriptType: 'InlineScript'
        azurePowerShellVersion: 'LatestVersion'
        pwsh: true
        Inline: |
          Write-Host "Deploying Bicep to Prod..."

          New-AzResourceGroupDeployment `
            -ResourceGroupName "$(resourceGroupNameProd)" `
            -TemplateFile "$(Build.SourcesDirectory)/infra/bicep/main.bicep" `
            -TemplateParameterFile "$(Build.SourcesDirectory)/infra/bicep/parameters/prod.json" `
            -Verbose